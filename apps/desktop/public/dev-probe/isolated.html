      Minimal served page for gated browser probes that must run under real
      cross-origin isolation. The isolation headers come from the dev server

      response headers injected on route-fulfilled pages do not confer
      isolation (measured 2026-10-17; see ADR-0244 threaded-WASM section).
      Probes attach their own module script via page.addInitScript or drive
      imports from /@fs URLs in page.evaluate.
