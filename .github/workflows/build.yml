name: Build + Package

permissions:
  contents: read
  actions: read
  checks: read

on:
  # Master pushes are already covered by ci.yml (Rust on three OSes, WASM, JS)
  # and the Native desktop E2E lane. This packaging matrix duplicates them and
  # is normally cancelled by the next push, so it runs only for pull requests
  # and explicit dispatch.
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    name: Build WASM engine (base + SIMD)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install just
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
        with:
          tool: just@1.54.0
      - name: Install wasm-pack (pinned, verified)
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
        with:
          tool: wasm-pack@0.13.1
          checksum: true
          fallback: none
      - name: wasm build (base + simd)
        run: just wasm-build-all
      - name: Upload wasm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: varve-wasm-release
          path: apps/desktop/public/wasm/

  # Which runners this event is allowed to use.
  #
  # The repository is public (2026-08-04), so GitHub-hosted runners are free and
  # unmetered — this is no longer about the bill. It is kept because a full
  # three-OS Tauri build on every PR costs 30-60 minutes of wall-clock feedback
  # for signal that a Linux build already gives, and because macOS and Windows
  # runners are a shared, queue-limited resource.
  #
  # Pull requests get the Linux gate only. The other runners are reserved for
  # pushes to the default branch and manual dispatch. Feature-branch pushes are
  # covered by the PR run, avoiding a duplicate three-OS build. Release artifacts
  # come from release.yml, not here.
  plan:
    name: Plan runners
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo 'matrix={"os":["ubuntu-latest"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"os":["ubuntu-latest","macos-latest","windows-latest"]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: [build-wasm, plan]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Limit simultaneous runner acquisitions: firing all three OS cells at
      # once is what starves the hosted runner pool during Actions incidents.
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.10.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libfontconfig1-dev libglib2.0-dev libsoup-3.0-dev \
            libgdk-pixbuf2.0-dev libcairo2-dev libpango1.0-dev \
            cmake pkg-config patchelf

      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Windows Rust target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Real Windows command dispatch and macOS path aliases need their own
      # native tooling check before spending time on Rust builds. Keep this on
      # each selected OS; the canonical CI workflow owns shared JS validation.
      - name: CI tooling portability preflight
        run: pnpm test:ci:tools

      - name: Lint (Rust)
        run: node scripts/cargo-with-generative-bindgen.mjs clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: node scripts/cargo-with-generative-bindgen.mjs test --workspace --all-targets

      - name: Download wasm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: varve-wasm-release
          path: apps/desktop/public/wasm/

      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop

      # Must run after "Build frontend". Anything that compiles the desktop
      # crate expands `tauri::generate_context!()`, which reads tauri.conf.json
      # and hard-fails if `frontendDist` ("../dist") is absent:
      #
      #   error: proc macro panicked
      #     = help: message: The `frontendDist` configuration is set to
      #             `"../dist"` but this path doesn't exist
      #
      # This step used to sit above the frontend build and failed on all three
      # runners for that reason. It went unnoticed because earlier steps in the
      # job errored first, so the ordering was never actually exercised.
      - name: Rust tests (desktop)
        run: node scripts/cargo-with-generative-bindgen.mjs test --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol

      # Compile-and-link check, not a packaging run. `--no-bundle` skips the
      # installer generation (AppImage tooling download, WiX, DMG staging),
      # which is the slow half of this matrix job. Release installers are built
      # by release.yml from a tag. The separate `linux-appimage-offline-smoke`
      # job below is the one non-publishing AppImage pack on pull requests.
      - name: Tauri build (release, no bundle)
        run: pnpm tauri build --ci --no-bundle --features custom-protocol
        working-directory: apps/desktop

      - name: Build test binary (debug + wdio features)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: pnpm tauri build --debug --no-bundle --config src-tauri/tauri.test.conf.json --features wdio,custom-protocol

      # Failure diagnostics are produced once per failed run by the ci-debug.yml
      # workflow_run, which sees every job's finalized logs; a per-job copy was
      # a partial duplicate of that report.

      # This matrix job does not upload installers. The AppImage offline-smoke
      # job below is the only packaging upload, and it is evidence only.

  # Non-publishing AppImage proof for PRs. Builds on ubuntu-22.04 (glibc 2.35
  # floor), prunes host GPU/system libs, then launches the file in ubuntu:22.04
  # and fedora:latest containers with no host WebKitGTK and --network none.
  # Does not create a tag, draft release, checksum asset, or GitHub Release.
  # The aarch64 cell matches release.yml: native ubuntu-22.04-arm, no QEMU.
  linux-appimage-offline-smoke:
    name: Linux AppImage (offline smoke ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.10.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libfontconfig1-dev libglib2.0-dev libsoup-3.0-dev \
            libgdk-pixbuf2.0-dev libcairo2-dev libpango1.0-dev \
            cmake pkg-config patchelf file \
            squashfs-tools xdg-utils

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: linux-appimage-offline-smoke-${{ matrix.arch }}
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
          cache-on-failure: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Pin linuxdeploy-plugin-gtk
        run: node scripts/release/ensure-linuxdeploy-plugin-gtk.mjs --tools-dir "$HOME/.cache/tauri"

      - name: Fetch ONNX Runtime for linux-${{ matrix.arch }}
        run: node scripts/fetch-onnxruntime.mjs

      - name: Prune foreign ONNX runtimes
        run: node scripts/release/prune-foreign-runtimes.mjs

      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop

      - name: Tauri AppImage (no updater artifacts)
        env:
          NO_STRIP: '1'
        run: >
          pnpm tauri build --bundles appimage --ci --features ai
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
        working-directory: apps/desktop

      - name: Prune bundled host GPU and system libraries
        run: |
          mkdir -p appimage-evidence
          node scripts/release/prune-appimage-bundled-libs.mjs \
            --bundle-dir apps/desktop/src-tauri/target/release/bundle \
            --arch ${{ matrix.arch }} \
            --tools-dir "$HOME/.cache/tauri" | tee appimage-evidence/prune.log

      - name: Verify AppImage squashfs permissions
        run: |
          node scripts/release/verify-appimage-permissions.mjs \
            --bundle-dir apps/desktop/src-tauri/target/release/bundle

      - name: Record size, SHA-256, and bundled library listing
        run: |
          set -euo pipefail
          IMG="$(find apps/desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          if [[ -z "${IMG}" ]]; then
            echo "::error::No AppImage was produced."
            exit 1
          fi
          IMG="$(realpath "${IMG}")"
          chmod +x "${IMG}"
          mkdir -p appimage-evidence
          echo "${IMG}" > appimage-evidence/path.txt
          stat -c '%s %n' "${IMG}" | tee appimage-evidence/size.txt
          sha256sum "${IMG}" | tee appimage-evidence/sha256.txt
          EXTRACT="$(mktemp -d "${RUNNER_TEMP:-/tmp}/varve-appimage-listing.XXXXXX")"
          (
            cd "${EXTRACT}"
            "${IMG}" --appimage-extract >/dev/null
            find squashfs-root/usr/lib -printf '%P\n' | sort > "${GITHUB_WORKSPACE}/appimage-evidence/usr-lib.txt"
          )
          echo "AppImage $(basename "${IMG}")"
          cat appimage-evidence/size.txt
          cat appimage-evidence/sha256.txt

      - name: Collect published-style AppImage name
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED="Varve-${VERSION}-${{ matrix.arch }}.AppImage"
          node scripts/release/collect-artifacts.mjs \
            --bundle-dir apps/desktop/src-tauri/target/release/bundle \
            --out appimage-evidence/collected \
            --os linux \
            --arch ${{ matrix.arch }} \
            --updater-signatures false
          COLLECTED="$(find appimage-evidence/collected -maxdepth 1 -name '*.AppImage' -printf '%f\n')"
          echo "collect-artifacts produced: ${COLLECTED}"
          if [[ "${COLLECTED}" != "${EXPECTED}" ]]; then
            echo "::error::Expected published-style name ${EXPECTED}, got ${COLLECTED}"
            exit 1
          fi
          if [[ "${COLLECTED}" == *-linux-* ]]; then
            echo "::error::AppImage filename still contains -linux-: ${COLLECTED}"
            exit 1
          fi
          stat -c '%s %n' "appimage-evidence/collected/${COLLECTED}" | tee appimage-evidence/collected-size.txt
          sha256sum "appimage-evidence/collected/${COLLECTED}" | tee appimage-evidence/collected-sha256.txt

      - name: Offline smoke (ubuntu:22.04 and fedora:latest)
        run: |
          set -euo pipefail
          IMG="$(find apps/desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          IMG="$(realpath "${IMG}")"
          mkdir -p appimage-evidence/smoke
          bash scripts/release/smoke-appimage-self-contained.sh \
            --appimage "${IMG}" \
            --distro all \
            --log-dir "${GITHUB_WORKSPACE}/appimage-evidence/smoke"

      - name: Upload AppImage offline-smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-appimage-offline-smoke-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            appimage-evidence/**
          if-no-files-found: warn
          retention-days: 14
