# Licence, advisory, ban, and source policy for both Cargo workspaces.
name: cargo-deny

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '33 4 * * 1'

concurrency:
  group: cargo-deny-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-deny@0.20.2
          checksum: true
          fallback: none
      - name: Check engine workspace
        run: cargo deny --manifest-path Cargo.toml check
      - name: Check desktop workspace
        run: cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml check
