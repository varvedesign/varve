title: "Q: "
body:
  - type: markdown
    attributes:
      value: |
        Ask anything about using Varve. A question is enough.

        If something is broken, you can also use a
        [bug report](https://github.com/varvedesign/varve/issues/new?template=bug_report.yml).

  - type: textarea
    id: question
    attributes:
      label: What's your question?
      description: Ask it the way you would ask a friend.
      placeholder: "How do I put text on a curve? Where did Export go?"
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried? (optional)
      description: Skip this if you have not tried anything yet.
      placeholder: "I looked in the Text menu, but I could not find it..."

  - type: input
    id: version-platform
    attributes:
      label: Which version of Varve? (optional)
      description: "Open Help > About, or look at the window title. You can also say Windows, Mac, Linux, or the web demo."
      placeholder: "0.5.1 on Windows"

  - type: textarea
    id: screenshot
    attributes:
      label: Picture (optional)
      description: Drag and drop a picture if it helps.
      placeholder: "A picture of the screen you are stuck on"

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else? (optional)
      description: Add more if you want. You can skip this.
      placeholder: "A link, extra detail, or what you hoped would happen..."
