name: Translation suggestion
description: Suggest a correction to a translation.
labels: ["lane: translation", "area: i18n"]
body:
  - type: input
    id: language
    attributes:
      label: Language
    validations:
      required: true
  - type: input
    id: string-key
    attributes:
      label: String key
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested translation
    validations:
      required: true
