# GHSA-g3hv-75wg-m249 is fixed only in minimatch 11.0.1. The workspace
# overrides 9.x/10.x onto that line. 3.x cannot take the major: ts-prune
# still `require('minimatch')` as a function, while 11.x CJS is a
# namespace. Ignore leftover 3.x, not the advisory id, so a later 9.x/10.x
# regression still fails the scan. mocha 12 now consumes minimatch 11.

[[PackageOverrides]]
name = "minimatch"
version = "3.1.5"
ecosystem = "npm"
ignore = true
effectiveUntil = 2026-12-30
reason = "Dev-only @ts-morph/common 0.12.3 (ts-prune) and recursive-readdir 2.2.3 (create-wdio). Both require() minimatch as a CJS function or Minimatch constructor; 11.x CJS is not callable. Patterns are repo-controlled. 3.x has no firstPhasePreProcess / optimizationLevel >= 2 path from GHSA-g3hv-75wg-m249."
