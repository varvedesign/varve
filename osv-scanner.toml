# OSV-Scanner allowlist for lockfile findings that already exist on master.
# This does not hide anything from scripts/security/dependency-advisories.mjs.
# Each IgnoredVulns entry names the remaining exposure and why this PR does
# not bump the lockfile. ignoreUntil is about 90 days out (2027-01-21);
# revisit then. PackageOverrides for leftover minimatch 3.x/5.x expire
# 2026-12-30 (~60 days) because those majors cannot take the patched 11.x
# CJS namespace without rewriting mocha and ts-prune.

