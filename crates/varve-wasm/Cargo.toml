[package]
name = "varve-wasm"
description = "wasm-bindgen glue for varve-engine (web IR build + hit test)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Threaded artifact (threaded-WASM program). Built with nightly + `-Z
# build-std` and shared-memory RUSTFLAGS by `just wasm-build-threads`; the
# shipped simd/baseline artifacts never enable it.
threads = ["dep:wasm-bindgen-rayon", "dep:rayon", "varve-trace/rayon"]

[dependencies]
varve-bridge = { path = "../varve-bridge" }
varve-core = { path = "../varve-core" }
varve-engine = { path = "../varve-engine" }
varve-trace = { path = "../varve-trace", features = ["wasm"] }
varve-media = { path = "../varve-media" }
wasm-bindgen = "0.2"
wasm-bindgen-rayon = { version = "1.3", optional = true }
rayon = { version = "1", optional = true }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Navigator"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
# wasm-pack's bundled wasm-opt binary in this environment doesn't validate
# bulk-memory ops emitted by the current Rust toolchain (fails with
# "Bulk memory operations require bulk memory [--enable-bulk-memory]").
# Disabled here; `just wasm-build` runs a separate manual wasm-opt pass
# (skipped gracefully if no system wasm-opt is on PATH) instead of relying
# on wasm-pack's bundled one.
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
