[package]
name = "varve-bgremove"
description = "Background removal: heuristic non-AI methods and optional ONNX inference for AI-powered matting."
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
image = "0.25"
dirs-next = "2.0"

# AI feature requires ONNX Runtime. `api-22` + `std` expose the plugin
# execution-provider APIs (`Environment::register_ep_library`,
# `SessionBuilder::with_devices`) used for the WebGPU EP; without them the
# `register_ep_library` cfg gate is off in standalone builds. The pinned
# runtime (ORT 1.27.1) is backward compatible with GetApi(22).
# Pinned exactly: rc.15 made Environment process-owned (`Session::builder`
# takes `&Environment`; `Environment::current` is crate-private). Stay on
# this API until a later rc is adapted the same way.
# Historical: rc.12 had a Vitis AI `register()` regression under
# `load-dynamic` (https://github.com/pykeio/ort/issues/547).
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["load-dynamic", "std", "api-22"] }
sha2 = "0.11"
url = "2"

[features]
default = []
ai = ["ort"]

[[example]]
name = "bgremove_bench"
required-features = ["ai"]

[[example]]
name = "webgpu_ep_probe"
required-features = ["ai"]

[lints]
workspace = true
