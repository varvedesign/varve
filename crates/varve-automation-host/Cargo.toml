[package]
name = "varve-automation-host"
description = "Local control-endpoint host for Varve automation: owner-only endpoint directory, per-instance credential, bounded line framing, and a relay trait so the application keeps the protocol (ADR-0245)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
    "io-util",
    "io-std",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
