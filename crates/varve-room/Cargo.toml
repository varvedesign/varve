[package]
name = "varve-room"
description = "Authoritative room host for Varve real-time collaboration: semantic-operation relay with durable journal, invite tokens, and presence (ADR-0200)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
futures-util = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"

[dev-dependencies]
tokio-tungstenite = "0.28"
